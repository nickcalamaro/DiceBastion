{{ define "main" }}
<link rel="stylesheet" href="{{ "css/forms.css" | relURL }}">
<div class="page-container" style="max-width: 640px; margin: 3rem auto; text-align: center;">
  <div class="hero-cta-banner" style="margin-bottom: 1.5rem;">
    <h1 class="hero-cta-title">Page not found</h1>
    <p class="hero-cta-subtitle" style="margin-bottom: 0;">
      That page is not in the Dice Bastion shop. It may have moved, or the link might be wrong.
    </p>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center;">
    <a href="{{ "/" | relURL }}" class="btn btn-primary">Back to shop</a>
    <a href="{{ "/cart/" | relURL }}" class="btn btn-secondary">View cart</a>
  </div>
</div>
{{ end }}
